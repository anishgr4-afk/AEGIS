:root{
  --bg:#09080D; --fg:#F5F1F2; --muted:#B8B3BC; --dim:#8C8791;
  --panel:rgba(245,241,242,.045); --panel2:rgba(245,241,242,.085);
  --line:rgba(245,241,242,.13); --line2:rgba(245,241,242,.07);
  --ok:#A8C5B3; --warn:#D8B7C0; --crit:#EF8A96; --r:10px;
  --f-disp:'Fraunces',Georgia,serif; --f-body:'Manrope','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:500 15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body{background:radial-gradient(900px 520px at 8% -10%,rgba(168,197,179,.07),transparent 70%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.b{transition:background .15s,border-color .15s}
.b:hover{border-color:rgba(168,197,179,.6)}
.lbl{font-family:var(--f-body);font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.s0{--c:var(--ok)} .s1{--c:var(--warn)} .s2{--c:var(--crit)}
@keyframes blink{50%{opacity:.25}} .blink{animation:blink 1.4s steps(2,start) infinite}

/* ---------- frame ---------- */
.app{min-height:100vh;padding:16px 20px 24px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 20px}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{font-family:var(--f-disp);font-size:22px;font-weight:500;letter-spacing:.22em}
.brand span{color:var(--muted)}
.met{display:flex;align-items:center;flex-wrap:wrap;gap:8px 18px}
.met .lbl{color:var(--muted)}
.met b{font-family:var(--f-disp);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;margin-left:8px}
.net{display:inline-flex;align-items:center;gap:9px;min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:13px;color:var(--muted)}
.net b{font-weight:700;color:var(--fg)}
.net .dot{background:var(--c)}

.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec h2{color:var(--muted)}
.sec .aside{font-size:13px;color:var(--muted);white-space:nowrap}
.sec .aside b{font-weight:700;color:var(--fg)}

.home{flex:1;display:flex;flex-wrap:wrap;gap:28px;min-height:0}
.left{flex:0 1 320px;min-width:270px;display:flex;flex-direction:column;gap:24px}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:14px}

/* ---------- crew ---------- */
.crew{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cb{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.cb .who{display:flex;flex-direction:column;min-width:0}
.cb .r{font-family:var(--f-disp);font-size:15px;font-weight:500;letter-spacing:.04em}
.cb .nm{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb .dot{position:absolute;top:9px;right:9px;background:var(--c)}
.cb.warn{border-color:rgba(216,183,192,.55)} .cb.crit{border-color:var(--crit)}
.cb[aria-pressed=true]{background:rgba(168,197,179,.13);border-color:var(--ok)}
.av{width:40px;height:40px;flex:none;border-radius:50%;background:#1A1820 center/cover no-repeat;border:2px solid rgba(245,241,242,.18)}
.av.sm{width:30px;height:30px;border-width:1.5px}
.cb[aria-pressed=true] .av{border-color:var(--ok)}
.cb.warn .av{border-color:var(--warn)} .cb.crit .av{border-color:var(--crit)}

/* ---------- vitals ---------- */
.vit .sec h2{display:flex;align-items:center;gap:10px;color:var(--fg);text-transform:none;letter-spacing:0;font-size:14px}
.vrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.vrow:last-child{border-bottom:0}
.vrow .l{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.vrow .k{display:flex;align-items:center;gap:8px;color:var(--muted)}
.vrow .v{font-family:var(--f-disp);font-size:26px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.vrow .u{font-size:12.5px;color:var(--muted);margin-left:6px}
.flag{padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:none;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.vsrc{display:block;font-size:12px;color:var(--dim)}
.notice{padding:10px 12px;border:1px solid rgba(216,183,192,.4);border-radius:var(--r);font-size:13.5px;color:var(--warn)}

/* ---------- search + filters ---------- */
.search{position:relative}
.search svg{position:absolute;left:16px;top:13px;pointer-events:none}
.search input{width:100%;height:48px;padding:0 120px 0 48px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--fg);font:500 15px var(--f-body)}
.search input::placeholder{color:var(--dim)}
.ftoggle{position:absolute;right:6px;top:6px;height:36px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--muted)}
.ftoggle[aria-expanded=true]{background:rgba(168,197,179,.15);border-color:var(--ok);color:var(--fg)}
.fpanel{display:flex;flex-direction:column;gap:14px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.fgroup{display:flex;flex-direction:column;gap:8px}
.fgroup>.lbl{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:14px}
.chip[aria-pressed=true]{background:rgba(168,197,179,.18);border-color:var(--ok)}
.fbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding-top:12px;border-top:1px solid var(--line2);font-size:13px;color:var(--muted)}
.ghost{min-height:40px;padding:0 16px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg)}
.ghost.sm{min-height:36px;padding:0 12px}
.primary,.jump{background:var(--ok);border:1px solid var(--ok);color:#09080D}
.primary:hover,.jump:hover{filter:brightness(1.08)}

/* ---------- procedure cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:4px;padding:12px 14px 14px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.card:hover{background:var(--panel2)}
.card .hd{font-size:12px;font-weight:700;color:var(--ok);min-height:16px}
.card svg.art{width:100%;height:84px;margin:2px 0 6px}
.card .t{font-family:var(--f-disp);font-size:16px;font-weight:500;line-height:1.25}
.card .m{font-size:12.5px;color:var(--dim);margin-top:auto}
.empty{display:flex;flex-direction:column;align-items:center;gap:14px;padding:32px 20px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}
.empty p:first-child{font-family:var(--f-disp);font-size:19px;color:var(--fg)}

/* ---------- ranked checklist ---------- */
.cl{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.cl.emergency{border-color:rgba(239,138,150,.55)} .cl.urgent{border-color:rgba(216,183,192,.45)}
.cl-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 14px}
.cl-h .lbl{color:var(--fg)} .cl-h small{font-size:12.5px;color:var(--muted)}
.cl-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cli{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;border-left:3px solid var(--line)}
.cli.emergency{border-left-color:var(--crit);--c:var(--crit)} .cli.urgent{border-left-color:var(--warn);--c:var(--warn)}
.cli.top{background:var(--panel2)}
.cln{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--line);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.cli.top .cln{background:var(--ok);border-color:var(--ok);color:#09080D}
.clt{display:flex;flex-direction:column;gap:1px;min-width:0}
.clt b{font-weight:700;font-size:14.5px}
.clt em{font-style:normal;font-size:12px;color:var(--dim)}
.clt em i{font-style:normal;font-weight:700;color:var(--c,var(--muted))}
.clt small{font-size:12.5px;color:var(--muted)}
.cla{display:flex;gap:6px}
.cla a,.cla button{display:inline-flex;align-items:center;min-height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);font-size:13px;font-weight:700;text-decoration:none}
.cla a{border-color:rgba(168,197,179,.5);color:var(--ok)}
.clmore{align-self:flex-start}
@media (max-width:600px){.cli{grid-template-columns:30px minmax(0,1fr)}.cla{grid-column:2}}

/* ---------- procedure page ---------- */
.proto{display:flex;flex-direction:column;gap:16px}
.ph{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px}
.back{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px 0 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--muted)}
.ph h2{flex:1 1 300px;font-family:var(--f-disp);font-size:26px;font-weight:500;line-height:1.15}
.meta-r{font-size:13px;color:var(--dim);white-space:nowrap}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.split.solo{grid-template-columns:minmax(0,1fr);max-width:820px}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;padding:12px 14px;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r)}
.step .no{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--line);font-family:var(--f-disp);font-size:16px;font-weight:500}
.step .tx{display:flex;flex-direction:column;gap:8px;min-width:0;padding-top:5px}
.step .main-t{font-size:16.5px;line-height:1.5;color:#E9E5EA}
.step .main-t b{font-weight:800;color:#FFF}
.figref{margin-left:4px;font-size:11.5px;font-weight:700;color:var(--muted)}
.locs{display:flex;flex-wrap:wrap;gap:6px}
.loc{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border:1px solid var(--line2);border-radius:6px;font-size:13px;color:var(--muted)}
.loc span{color:var(--fg)} .loc em{font-style:normal;color:var(--dim)}
.dose{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:8px 12px;border:1px solid rgba(168,197,179,.4);border-radius:8px;background:rgba(168,197,179,.06);font-size:14px}
.dose .lbl{color:var(--ok)} .dose b{font-weight:700}
.cond{display:flex;align-items:flex-start;gap:8px;margin:10px 0 0;font-size:14px;font-weight:700;color:var(--muted)}
.cond b{color:var(--fg)}
.note{display:flex;gap:12px;padding:10px 14px;border-radius:var(--r);background:var(--panel);font-size:14.5px;line-height:1.5}
.note .lbl{flex:none;padding-top:2px;color:var(--muted)}
.note.warn{background:rgba(239,138,150,.08);border:1px solid rgba(239,138,150,.4)}
.note.warn .lbl{color:var(--crit)}
.jump{align-self:flex-start;min-height:36px;padding:0 14px;border-radius:8px;font-size:13.5px;font-weight:700}
.fig{position:sticky;top:16px;display:flex;flex-direction:column;gap:10px}
.state{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r)}
.state.unc{border-color:rgba(239,138,150,.5);background:rgba(239,138,150,.06)}
.state .lbl{display:block;margin-bottom:2px;color:var(--muted)}
.state.unc .lbl{color:var(--crit)}
.state b{display:block;font-family:var(--f-disp);font-size:18px;font-weight:500}
.state small{font-size:13px;color:var(--muted)}
.frame{position:relative;aspect-ratio:4/3.3;display:flex;align-items:center;justify-content:center;padding:26px;border:1px solid var(--line2);border-radius:var(--r);background:#050408}
.frame img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:screen}
.frame .tag{position:absolute;left:12px;top:10px;color:var(--dim)}
.cap{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--dim)}
.cap b{font-weight:700;color:var(--fg)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{position:relative;width:64px;height:54px;padding:4px;display:flex;align-items:center;justify-content:center;background:#050408;border:1px solid var(--line2);border-radius:6px}
.thumb img{max-width:100%;max-height:100%;mix-blend-mode:screen}
.thumb span{position:absolute;left:5px;top:2px;font-size:10px;font-weight:700;color:var(--muted)}
.thumb[aria-pressed=true]{border-color:var(--ok)}
.src{margin-top:8px;font-size:12.5px;line-height:1.4;color:var(--dim)}
@media (max-width:1100px){.split{grid-template-columns:1fr}.fig{position:static;order:-1}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
</style>

/* ---------- live backend (app.py) ----------
   Every crewmember's wearables stream to the backend (simulator.py). The
   backend (telemetry.py) judges the readings; this page only shows its

   Checklist procedures to open, most urgent first. */
var API=location.protocol==='file:'?'http://127.0.0.1:5000':'';
var LIVE={err:'Connecting to the console…',crew:{},comms:null,inputs:null,match:null,seq:0,shown:'',picked:false};
var LIVE_ROWS=[ /* label, telemetry signal, triage flag id, unit, decimals */
 ['Heart rate','heart_rate_bpm','heart_rate_bpm','bpm',0],
 ['Blood pressure','bp_systolic_est','blood_pressure','mmHg sys. est.',0],
 ['Resp. rate','respiratory_rate_bpm','respiratory_rate_bpm','/min',0],
 ['SpO₂','spo2_pct','spo2_pct','%',0],

var AV={CDR:0,PLT:1,MS1:2,MS2:3};  /* crew photos, embedded in the stylesheet as .av0-.av3 */
function av(p,sm){return '<span class="av'+(sm?' sm':'')+(p.id in AV?' av'+AV[p.id]:'')+'" aria-hidden="true"></span>'}
function rec(i){var p=CREW[i];return p?LIVE.crew[p.id]:null}
function online(i){var r=rec(i);return !!(r&&r.t&&r.t.feed&&r.t.feed.online)}
function liveLevel(i){return online(i)?(SEV[rec(i).t.triage.urgency]||0):0}
function flagsById(t){var m={};((t&&t.triage&&t.triage.flags)||[]).forEach(function(f){m[f.id]=Math.max(m[f.id]||0,SEV[f.severity]||0)});return m}
function spark(s,c){if(s.length<2)return '<svg width="84" height="32" aria-hidden="true" style="flex:none"></svg>';
  var mn=Math.min.apply(null,s),mx=Math.max.apply(null,s);
  var pts=s.map(function(v,i){return[4+i*92/(s.length-1),mx===mn?16:27-(v-mn)/(mx-mn)*22]}),e=pts[pts.length-1];
  return '<svg width="84" height="32" viewBox="0 0 100 32" aria-hidden="true" style="flex:none"><polyline points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'" fill="none" stroke="'+c+'" stroke-width="1.5" stroke-linejoin="round"/><circle cx="'+e[0].toFixed(1)+'" cy="'+e[1].toFixed(1)+'" r="2.8" fill="'+c+'"/></svg>'}
function liveVitalsHtml(){
  var R=rec(S.person),ok=online(S.person),t=R&&R.t,sig=(t&&t.signals)||{},fl=flagsById(t);
  var why=LIVE.err||(CREW[S.person]?'No wearable feed for '+CREW[S.person].role+'. Start simulator.py.':'');
  return (ok?'':'<p class="notice">'+esc(why)+'</p>')+LIVE_ROWS.map(function(r){
    var s=ok?sig[r[1]]:null,on=!!(s&&s.status==='measured'),lv=on?(fl[r[2]]||0):0,c=on?LVC[lv]:'#8C8791';
    var sub=on?s.source_label+(s.context&&s.context!=='rest'?' · '+s.context:''):(s&&s.reason?s.reason:'Not measured');
    return '<div class="vrow"><div class="l"><span class="k lbl">'+r[0]+(lv?'<span class="flag s'+lv+'">'+FLAG_TXT[lv]+'</span>':'')+'</span><span style="white-space:nowrap"><span class="v" style="color:'+c+'">'+(on?Number(s.value).toFixed(r[4]):'—')+'</span><span class="u">'+r[3]+'</span></span><span class="vsrc">'+esc(sub)+'</span></div>'+
     spark(on?(R.hist[r[1]]||[]):[],c)+'</div>'}).join('')}
function fmtDelay(s){function d(x){return x<100?x.toFixed(1).replace(/\.0$/,''):String(Math.round(x))}return s<60?d(s)+' s':d(s/60)+' min'}
function netHtml(){if(!S.link)return '<span class="dot s1 blink"></span><b>Offline</b> · saving on board';var c=LIVE.comms;return '<span class="dot s0"></span><b>Earth link</b>'+(c?' · '+fmtDelay(c.comms_delay_seconds)+' one way':'')}

/* Page filter chips -> checklist engine inputs (data/checklist_triage.json).
   Nothing here asks for a reading the wearables already measure. */
function toBackend(){
  var f=S.f,sy={},sg={};
  function has(g,v){return f[g].indexOf(v)>-1} function area(a){return has('area',a)}
  if(has('state','unc'))sg.unresponsive=1;
  if(has('sign','nobreath'))sg.not_breathing=1;
  if(has('sign','nopulse'))sg.no_pulse=1;
  if(has('sign','choking'))sg.choking=1;
  if(has('sign','wheeze')||has('sign','sob'))sy.shortness_breath=1;
  if(has('sign','bleed'))sg.heavy_bleeding=1;
  if(has('sign','burn'))sg.major_burn=1;
  if(has('sign','rash')){if(has('cause','allergen'))sg.allergic_swelling=1;else sy.skin_rash_burn=1}
  if(has('sign','pale'))sg.pale_sweaty=1;
  if(has('sign','seizure'))sg.seizing=1;
  if(has('sign','confused'))sg.confused_drowsy=1;
  if(has('sign','vomit'))sy.nausea_vomiting=1;
  if(has('sign','pain')){if(area('chest'))sy.chest_pain=1;if(area('abdomen'))sy.abdominal_pain=1;if(area('head'))sy.headache_dizziness=1;if(area('eyes'))sg.red_sore_eye=1;if(area('airway'))sg.sore_throat=1}
  if(has('sign','object')){if(area('eyes'))sg.object_in_eye=1;if(area('chest'))sg.chest_injury=1;if(area('abdomen'))sg.abdominal_injury=1;if(!area('eyes')&&!area('chest')&&!area('abdomen'))sg.deep_cut=1}
  if(has('cause','impact')){if(area('head'))sg.head_neck_injury=1;if(area('chest'))sg.chest_injury=1;if(area('abdomen'))sg.abdominal_injury=1}
  if(has('cause','chemical')){if(area('eyes'))sg.chemical_in_eye=1;if(area('skin'))sg.chemical_on_skin=1;if(area('airway'))sg.smoke_or_fumes_inhaled=1}
  if(has('cause','fire')&&area('airway'))sg.smoke_or_fumes_inhaled=1;
  if(has('cause','allergen')&&!has('sign','rash')&&!sy.shortness_breath)sg.hives_itching=1;
  S.r.forEach(function(k){var x=k.split(':');(x[0]==='sym'?sy:sg)[x[1]]=1});
  return {symptoms:Object.keys(sy),signs:Object.keys(sg)}}
/* Engine inputs the chips above already reach; the rest get their own chips. */
var COVERED={unresponsive:1,not_breathing:1,no_pulse:1,choking:1,heavy_bleeding:1,major_burn:1,allergic_swelling:1,pale_sweaty:1,seizing:1,confused_drowsy:1,object_in_eye:1,chest_injury:1,abdominal_injury:1,head_neck_injury:1,chemical_in_eye:1,chemical_on_skin:1,smoke_or_fumes_inhaled:1,
  shortness_breath:1,skin_rash_burn:1,nausea_vomiting:1,chest_pain:1,abdominal_pain:1,headache_dizziness:1};
function extraGroupsHtml(){var d=LIVE.inputs;if(!d)return '';
  var rep=d.symptoms.filter(function(x){return !COVERED[x.id]}).map(function(x){return['sym',x]}).concat(d.signs.filter(function(x){return x.kind==='report'&&!COVERED[x.id]}).map(function(x){return['sign',x]}));
  var obs=d.signs.filter(function(x){return x.kind!=='report'&&!COVERED[x.id]}).map(function(x){return['sign',x]});
  return [['What else do they report?',rep],['What else do you see?',obs]].map(function(g){
    return '<div class="fgroup"><span class="lbl">'+g[0]+'</span><div class="chips">'+g[1].map(function(o){var v=o[0]+':'+o[1].id,on=S.r.indexOf(v)>-1;
      return '<button class="chip b" data-a="rchip" data-v="'+v+'" aria-pressed="'+on+'"'+(o[1].prompt?' title="'+esc(o[1].prompt)+'"':'')+'>'+esc(o[1].label)+'</button>'}).join('')+'</div></div>'}).join('')}

var TIER_TXT={emergency:'Act now',urgent:'Within minutes',routine:'Routine'};
/* The page's 13 step-by-step emergencies (E, in order) as checklist section ids. */
var SEC=['breathing_difficulty','choking_conscious','choking_unconscious','cpr','abdominal_injury','allergic_severe','burns_major','chest_injury','chest_pain','eye_penetrating','head_neck_injury','seizures','shock'];
var SHOW_TOP=3;
function crewInputs(){var b=toBackend();return b.symptoms.length+b.signs.length>0}
/* Procedures come back from the engine already ranked: urgency tier first
   (act now > within minutes > routine), then the procedure that a rule names
   first, then airway > breathing > circulation > the rest. */
function checklistHtml(){var d=LIVE.match;if(!d||!d.matches||!d.matches.length)return '';
  var list=S.clAll?d.matches:d.matches.slice(0,SHOW_TOP),more=d.matches.length-SHOW_TOP;
  return '<section class="cl '+d.tier+'" aria-label="Medical Checklist procedures, most urgent first"><div class="cl-h"><span class="lbl">'+(crewInputs()?'Do these in order':'Live vitals suggest')+'</span>'+
    (d.comms.round_trip_min?'<small>Surgeon reply takes at least '+d.comms.round_trip_min+' min. Do every other step without waiting.</small>':'')+'</div><ol class="cl-list">'+
    list.map(function(m,k){var card=SEC.indexOf(m.id);
      return '<li class="cli '+m.tier+(k===0?' top':'')+'"><span class="cln" aria-hidden="true">'+(k+1)+'</span><span class="clt"><b>'+esc(m.title)+'</b><em><i>'+TIER_TXT[m.tier]+'</i>'+(k===0?' · start here':'')+' · p. '+esc(m.pages)+(m.surgeon_approval_meds.length?' · surgeon approval first':'')+'</em>'+
        '<small>'+esc(m.reasons[0]||'')+'</small></span><span class="cla">'+(card>-1?'<button class="b" data-a="open" data-i="'+card+'">Steps</button>':'')+
        '<a class="b" href="'+API+m.pdf_url+'" target="_blank" rel="noopener" aria-label="Open checklist PDF: '+esc(m.title)+'">PDF</a></span></li>'}).join('')+'</ol>'+
    (more>0?'<button class="ghost sm b lbl clmore" data-a="clmore">'+(S.clAll?'Show top '+SHOW_TOP+' only':'Show '+more+' more')+'</button>':'')+'</section>'}
/* With crew inputs, the cards follow the engine: only matched procedures,
   in its order. Without them, the page's own browse filter applies. */
function rankedCards(){if(!crewInputs())return null;var d=LIVE.match,out=[];
  if(d&&d.matches)d.matches.forEach(function(m){var i=SEC.indexOf(m.id);if(i>-1&&matches(i,{}))out.push(i)});return out}
function drawChecklist(){
  var d=LIVE.match,key=(S.clAll?'all|':'')+(crewInputs()?'in|':'')+(d&&d.matches?d.matches.map(function(m){return m.id+':'+m.tier+':'+m.reasons[0]}).join(','):'');
  if(key===LIVE.shown)return;LIVE.shown=key;
  var el=document.getElementById('cl');if(el)el.innerHTML=checklistHtml();
  var r=document.getElementById('res');if(r)r.innerHTML=cardsHtml();
  var fc=document.getElementById('fcount');if(fc)fc.textContent=countText()}
function requestMatch(){
  var b=toBackend(),P=CREW[S.person],live=online(S.person),seq=++LIVE.seq;
  if(!P||(!b.symptoms.length&&!b.signs.length&&!live)){LIVE.match=null;drawChecklist();return}
  fetch(API+'/api/checklist/match',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({crew:P.id,symptoms:b.symptoms,signs:b.signs,use_live_vitals:live})})
   .then(function(r){return r.json()}).then(function(d){if(seq!==LIVE.seq)return;LIVE.match=d.matches?d:null;drawChecklist()})
   .catch(function(){if(seq===LIVE.seq){LIVE.match=null;drawChecklist()}})}
function poll(){
  fetch(API+'/api/lifeline/live').then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
    LIVE.err='';LIVE.comms=d.comms;
    CREW=d.crew.map(function(c){return{id:c.id,role:c.role,name:c.name}});
    d.crew.forEach(function(c){var R=LIVE.crew[c.id]=LIVE.crew[c.id]||{hist:{},simT:null},t=c.telemetry;
      if(R.simT!==null&&t.sim_time_s!==null&&t.sim_time_s<R.simT)R.hist={};  /* feed was reset */
      if(t.feed&&t.feed.online&&t.sim_time_s!==R.simT){LIVE_ROWS.forEach(function(r){var x=t.signals[r[1]];if(x&&x.status==='measured'){var h=R.hist[r[1]]=R.hist[r[1]]||[];h.push(x.value);if(h.length>40)h.shift()}})}
      R.simT=t.sim_time_s;R.t=t});
    if(!LIVE.picked&&CREW.length){  /* open on the most urgent crewmember */
      LIVE.picked=true;var best=-1,bi=0;CREW.forEach(function(p,i){var l=liveLevel(i)*2+(p.id===d.default_crew?1:0);if(l>best){best=l;bi=i}});
      S.person=bi;if(S.open<0)renderMain()}
    if(S.person>=CREW.length)S.person=0;
  }).catch(function(){LIVE.err='Console not reachable. Start app.py.'}).then(function(){
    var ae=document.activeElement,key=ae&&ae.closest&&ae.closest('#left')&&ae.getAttribute('data-a')?'[data-a="'+ae.getAttribute('data-a')+'"]'+(ae.hasAttribute('data-i')?'[data-i="'+ae.getAttribute('data-i')+'"]':''):null;
    renderLeft();if(key){var el=document.querySelector('#left '+key);if(el)el.focus()}
    requestMatch()})}
function loadInputs(){fetch(API+'/api/checklist/inputs').then(function(r){return r.json()}).then(function(d){LIVE.inputs=d;if(S.open<0)refreshList()}).catch(function(){})}

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function plain(s){return s.replace(/\*\*/g,'')}
function pad(n){return(n<10?'0':'')+n}
var TRI='<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.2v.1"/>';
function tri(c,label){return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" '+(label?'role="img" aria-label="'+label+'"':'aria-hidden="true"')+'>'+TRI+'</svg>'}
function art(k,sw){var a=ART[k];sw=sw||1;return '<path d="'+a.mesh+'" fill="none" stroke="#F5F1F2" stroke-opacity=".2" stroke-width="'+(.7*sw)+'"/><path d="'+a.edge+'" fill="none" stroke="#F5F1F2" stroke-opacity=".95" stroke-width="'+(1.1*sw)+'"/><path d="'+a.dots+'" fill="none" stroke="#F5F1F2" stroke-width="'+(2.4*sw)+'" stroke-linecap="round"/><path d="'+a.accent+'" fill="none" stroke="#D8B7C0" stroke-width="'+(2.4*sw)+'" stroke-linejoin="round" stroke-linecap="round"/><path d="'+a.hot+'" fill="#D8B7C0"/>'}
function figUrl(k){return 'data:image/png;base64,'+FIG[F[k].src]}
var PIN='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18"/><path d="M4 12h16M10 7.5h4M10 16.5h4"/></svg>';
var ARROW='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>';

/* ---------- dashboard ---------- */
function crewHtml(){if(!CREW.length)return '<p class="notice" style="grid-column:1/-1">'+esc(LIVE.err||'Waiting for the crew roster…')+'</p>';
  return CREW.map(function(p,i){var w=liveLevel(i),sel=i===S.person;
  return '<button class="cb b '+LVN[w]+'" data-a="person" data-i="'+i+'" aria-pressed="'+sel+'" aria-label="'+p.role+' '+p.name+(w===2?', act now':w===1?', watch':'')+'">'+av(p)+
   '<span class="who"><span class="r">'+p.role+'</span><span class="nm">'+esc(p.name)+'</span></span>'+(w?'<span class="dot s'+w+'" aria-hidden="true"></span>':'')+'</button>'}).join('')}
function vitalsHtml(){return liveVitalsHtml()}
/* ---------- search filters ---------- */
var FG = [
 {k:'state', t:'Is the person awake?', o:[['con','Conscious'],['unc','Unconscious']]},
 {k:'area', t:'Where on the body?', o:[['head','Head'],['eyes','Eyes'],['airway','Airway & throat'],['chest','Chest'],['abdomen','Abdomen'],['skin','Skin'],['body','Whole body']]},
 {k:'sign', t:'What do you see?', o:[['nobreath','Not breathing'],['nopulse','No pulse'],['choking','Choking'],['wheeze','Wheezing'],['sob','Short of breath'],['bleed','Bleeding'],['pain','Pain'],['burn','Burn'],['rash','Rash or swelling'],['pale','Pale & sweaty'],['seizure','Shaking / seizure'],['confused','Confused or drowsy'],['vomit','Vomiting'],['object','Object stuck in body']]},
 {k:'cause', t:'What caused it?', o:[['eating','Eating'],['chemical','Dust or chemicals'],['impact','Impact or fall'],['fire','Fire or electricity'],['allergen','Allergy'],['none','No clear cause']]}
];
var TAGS = [
 {state:'con',area:'airway chest',sign:'wheeze sob choking',cause:'eating chemical'},
 {state:'con',area:'airway',sign:'choking sob',cause:'eating'},
 {state:'unc',area:'airway',sign:'choking nobreath',cause:'eating'},
 {state:'unc',area:'chest body',sign:'nobreath nopulse',cause:'none impact fire'},
 {state:'con unc',area:'abdomen',sign:'bleed pain vomit',cause:'impact'},
 {state:'con unc',area:'skin airway body',sign:'wheeze sob rash pale',cause:'allergen'},
 {state:'con unc',area:'skin body',sign:'burn pain',cause:'fire chemical'},
 {state:'con unc',area:'chest',sign:'bleed sob pain object',cause:'impact'},
 {state:'con unc',area:'chest',sign:'pain pale sob',cause:'none'},
 {state:'con',area:'eyes head',sign:'object pain bleed',cause:'impact'},
 {state:'con unc',area:'head',sign:'bleed confused vomit',cause:'impact'},
 {state:'con unc',area:'head body',sign:'seizure confused',cause:'none impact'},
 {state:'con unc',area:'body',sign:'pale confused bleed',cause:'impact allergen fire none'}
];
TAGS.forEach(function(t){for(var k in t)t[k]=t[k].split(' ')});

function hay(e){return(e.t+' '+e.items.map(function(i){return(i.t||i.if||i.sub||i.note||i.warn||'')+' '+(i.loc||[]).map(function(k){return L[k].join(' ')}).join(' ')+' '+(i.dose||[]).join(' ')}).join(' ')).toLowerCase().replace(/\*\*/g,'')}
E.forEach(function(e){e.hay=hay(e)});
function nActive(){var n=0;for(var k in S.f)n+=S.f[k].length;return n+S.r.length}
function matches(i,f){
  var e=E[i],w=S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(!w.every(function(q){return e.hay.indexOf(q)>-1}))return false;
  for(var k in f){if(f[k].length&&!f[k].some(function(v){return TAGS[i][k].indexOf(v)>-1}))return false}
  return true}
function hits(){var r=[];E.forEach(function(e,i){if(matches(i,S.f))r.push(i)});return r}
function filtersHtml(){
  if(!S.panel)return '';
  var h='<div class="fpanel">';
  FG.forEach(function(g){
    h+='<div class="fgroup"><span class="lbl">'+g.t+'</span><div class="chips">'+g.o.map(function(o){
      var on=S.f[g.k].indexOf(o[0])>-1;
      return '<button class="chip b" data-a="chip" data-g="'+g.k+'" data-v="'+o[0]+'" aria-pressed="'+on+'">'+o[1]+'</button>'}).join('')+'</div></div>'});
  h+=extraGroupsHtml();
  return h+'<div class="fbar"><span id="fcount">'+countText()+'</span><span style="display:flex;gap:8px">'+(nActive()?'<button class="ghost sm b lbl" data-a="reset">Clear filters</button>':'')+'<button class="ghost sm b lbl primary" data-a="hide">Show results</button></span></div></div>'}
function countText(){if(!crewInputs())return hits().length+' of 13 match';var d=LIVE.match,n=d&&d.matches?d.matches.length:0;return n+(n===1?' checklist procedure':' checklist procedures')}
function cardBtn(i,n){var e=E[i];
  return '<button class="card b" data-a="open" data-i="'+i+'" aria-label="'+esc(e.t)+', '+e.steps+' steps">'+
   (n?'<span class="hd">#'+n+'</span>':'')+
   '<svg class="art" viewBox="0 0 240 170" aria-hidden="true">'+art(e.art)+'</svg><span class="t">'+esc(e.t)+'</span><span class="m">'+e.steps+' steps · p. '+e.pg+'</span></button>'}
function grid(list,ranked){return '<div class="grid">'+list.map(function(i,k){return cardBtn(i,ranked?k+1:0)}).join('')+'</div>'}
function cardsHtml(){
  var ranked=rankedCards();
  if(ranked){
    if(ranked.length)return '<div class="sec"><h2 class="lbl">Step-by-step guides for these</h2></div>'+grid(ranked,true);
    return LIVE.match&&LIVE.match.matches.length?'':'<div class="empty"><p>Nothing matches these yet</p><p>Add what you can see, or what they tell you. Record vitals for the surgeon either way.</p><button class="ghost b" data-a="reset">Start over</button></div>'}
  var list=hits();
  if(!list.length)return '<div class="empty"><p>No guide matches that search</p><button class="ghost b" data-a="reset">Clear search and filters</button></div>';
  if(S.q.trim()||nActive())return grid(list);
  var a=list.filter(function(i){return i<4}),b=list.filter(function(i){return i>=4});
  return (a.length?'<div class="sec"><h2 class="lbl">Immediate life support</h2><span class="aside">'+a.length+' guides</span></div>'+grid(a):'')+
   (b.length?'<div class="sec" style="margin-top:14px"><h2 class="lbl">Other emergencies</h2><span class="aside">'+b.length+' guides</span></div>'+grid(b):'')}
function listHtml(){
  var P=CREW[S.person],n=nActive();
  return '<div class="sec"><h2 class="lbl">What is happening?</h2><span class="aside">Patient <b>'+(P?P.role+' · '+P.name:'—')+'</b></span></div>'+
   '<div class="search"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8C8791" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'+
   '<input id="q" type="search" autocomplete="off" placeholder="Search symptoms, situations or equipment" aria-label="Search emergencies" value="'+esc(S.q)+'">'+
   '<button class="ftoggle b lbl" data-a="toggle" aria-expanded="'+S.panel+'">Filters'+(n?' · '+n:'')+'</button></div>'+
   '<div id="filters">'+filtersHtml()+'</div><div id="cl">'+checklistHtml()+'</div><div id="res">'+cardsHtml()+'</div>'}
function refreshList(){LIVE.shown='';document.getElementById('filters').innerHTML=filtersHtml();document.getElementById('res').innerHTML=cardsHtml();var cl=document.getElementById('cl');if(cl)cl.innerHTML=checklistHtml();
  var t=document.querySelector('[data-a=toggle]'),n=nActive();if(t){t.textContent='Filters'+(n?' · '+n:'');t.setAttribute('aria-expanded',S.panel)}}

/* ---------- protocol (inside the right panel) ---------- */
function stateHtml(k){
  if(k==='con')return '<div class="state"><svg width="56" height="56" viewBox="0 0 64 64" fill="none" stroke="#F5F1F2" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="32" cy="32" r="26"/><ellipse cx="22" cy="28" rx="5" ry="4"/><ellipse cx="42" cy="28" rx="5" ry="4"/><circle cx="22" cy="28" r="1.6" fill="#F5F1F2"/><circle cx="42" cy="28" r="1.6" fill="#F5F1F2"/><ellipse cx="32" cy="45" rx="4" ry="5"/><path d="M14 58q4-6 9-5M50 58q-4-6-9-5"/></svg>'+
   '<div><span class="lbl" >Patient state</span><b>Conscious</b><small>Eyes open · can respond · may show the choking sign</small></div></div>';
  return '<div class="state unc"><svg width="56" height="56" viewBox="0 0 64 64" fill="none" stroke="#F5F1F2" stroke-width="2" stroke-linecap="round" aria-hidden="true"><g transform="rotate(-90 32 32)"><circle cx="32" cy="32" r="26"/><path d="M17 28q5 4 10 0M37 28q5 4 10 0"/><path d="M26 44h12"/></g></svg>'+
   '<div style="flex:1"><span class="lbl" >Patient state</span><b>Unconscious</b><small>Eyes closed · no response · lay flat on their back</small></div></div>'}
function locHtml(keys){return '<span class="locs">'+keys.map(function(k){return '<span class="loc">'+PIN+'<span>'+esc(L[k][0])+'</span><em>'+esc(L[k][1])+'</em></span>'}).join('')+'</span>'}
var ABC='ABCDEFGH';
function protoHtml(){
  var e=E[S.open],figs=[];e.items.forEach(function(it){if(it.fig&&figs.indexOf(it.fig)<0)figs.push(it.fig)});
  var fk=S.fig&&figs.indexOf(S.fig)>-1?S.fig:figs[0];
  var steps=e.items.map(function(it){
    var arrow='<svg width="16" height="18" viewBox="0 0 24 24" fill="none" stroke="#8C8791" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:2px"><path d="M6 4v8h12M13 7l5 5-5 5"/></svg>';
    if(it.if)return '<div class="cond">'+arrow+'<span>If '+md(it.if)+'</span></div>';
    if(it.sub)return '<div class="cond">'+arrow+'<span>'+md(it.sub)+'</span></div>';
    if(it.warn)return '<div class="note warn"><span class="lbl">Warning</span><span>'+md(it.warn)+'</span></div>';
    if(it.note)return '<div class="note"><span class="lbl">Note</span><span>'+md(it.note)+'</span></div>';
    var fl=it.fig?ABC[figs.indexOf(it.fig)]:'';
    return '<div class="step"><span class="no">'+it.n+'</span><span class="tx"><span class="main-t">'+md(it.t)+(fl?' <span class="figref">FIG '+fl+'</span>':'')+'</span>'+(it.loc?locHtml(it.loc):'')+
     (it.dose?'<span class="dose"><span class="lbl">Dose</span><b>'+esc(it.dose[0])+'</b><span>'+esc(it.dose[1])+'</span></span>':'')+
     (it.go!==undefined?'<button class="jump b" data-a="open" data-i="'+it.go+'">Open '+esc(E[it.go].t)+' →</button>':'')+'</span></div>'}).join('');
  var frame=fk?
   '<div class="frame"><span class="tag lbl">Fig '+ABC[figs.indexOf(fk)]+' · Med C/L '+F[fk].pg+'</span><img src="'+figUrl(fk)+'" alt="'+esc(F[fk].cap)+'"></div>'+
   '<div class="cap"><b>'+esc(F[fk].cap)+'</b><span>Checklist p. '+F[fk].pg+'</span></div>'+
   (figs.length>1?'<div class="thumbs">'+figs.map(function(k,x){return '<button class="thumb b" data-a="fig" data-k="'+k+'" aria-pressed="'+(k===fk)+'" aria-label="Show figure '+ABC[x]+': '+esc(F[k].cap)+'"><img src="'+figUrl(k)+'" alt=""><span>'+ABC[x]+'</span></button>'}).join('')+'</div>':''):
   '';
  return '<section class="proto" aria-label="'+esc(e.t)+'"><div class="ph">'+
   '<button class="back b lbl" data-a="back">'+ARROW+'All emergencies</button>'+
   '<h2>'+esc(e.t)+'</h2>'+
   '<span class="meta-r">'+e.steps+' steps · p. '+e.pg+'</span></div>'+
   '<div class="split'+(fk||e.state?'':' solo')+'"><div class="steps">'+steps+'<p class="src">Adapted from the NASA Medical Checklist JSC-48031, Rev H (2001), p. '+e.pg+'. Prototype for design and demo use, not clinical guidance.</p></div>'+
   (fk||e.state?'<aside class="fig">'+(e.state?stateHtml(e.state):'')+frame+'</aside>':'')+'</div></section>'}

/* ---------- render + events ---------- */
var view=document.getElementById('view');
function renderLeft(){var P=CREW[S.person],n=document.getElementById('net');
  n.innerHTML=netHtml();n.setAttribute('aria-label',(S.link?'Earth link connected':'Earth link offline')+'. Tap to switch the demo state.');
  document.getElementById('left').innerHTML=
   '<section><div class="sec"><h2 class="lbl">Crew</h2></div><div class="crew">'+crewHtml()+'</div></section>'+
   '<section class="vit"><div class="sec"><h2 class="lbl">'+(P?av(P,1)+'<span>'+esc(P.name)+' · '+P.role+'</span>':'Vitals')+'</h2><span class="aside">Live vitals</span></div><div>'+vitalsHtml()+'</div></section>'}
function renderMain(){document.getElementById('main').innerHTML=S.open<0?listHtml():protoHtml()}
view.innerHTML='<div class="home"><aside class="left" id="left"></aside><main class="main" id="main"></main></div>';
function render(){renderLeft();renderMain()}
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-a]');if(!el)return;var a=el.getAttribute('data-a'),i=+el.getAttribute('data-i');
  if(a==='person'||a==='link'){if(a==='person'){S.person=i;LIVE.match=null;LIVE.shown='';requestMatch()}else S.link=!S.link;renderLeft();if(S.open<0){var as=document.querySelector('.sec .aside');if(as){var P=CREW[S.person];as.innerHTML='Patient <b>'+P.role+' · '+P.name+'</b>'}}return}
  if(a==='chip'){var g=el.getAttribute('data-g'),v=el.getAttribute('data-v'),x=S.f[g].indexOf(v);if(x>-1)S.f[g].splice(x,1);else S.f[g].push(v);refreshList();requestMatch();return}
  if(a==='rchip'){var rv=el.getAttribute('data-v'),rx=S.r.indexOf(rv);if(rx>-1)S.r.splice(rx,1);else S.r.push(rv);refreshList();requestMatch();return}
  if(a==='reset'){S.q='';for(var k in S.f)S.f[k]=[];S.r=[];requestMatch();var q=document.getElementById('q');if(q)q.value='';refreshList();return}
  if(a==='hide'){S.panel=false;refreshList();return}
  if(a==='clmore'){S.clAll=!S.clAll;drawChecklist();return}
  if(a==='toggle'){S.panel=!S.panel;refreshList();return}
  if(a==='open'){S.open=i;S.fig=null;renderMain();window.scrollTo(0,0);return}
  if(a==='back'){S.open=-1;renderMain();return}
  if(a==='fig'){S.fig=el.getAttribute('data-k');renderMain();return}});
document.addEventListener('focusin',function(ev){if(ev.target.id==='q'&&!S.panel){S.panel=true;refreshList()}});
document.addEventListener('input',function(ev){if(ev.target.id==='q'){S.q=ev.target.value;refreshList()}});

/* background + clock */
var T0=Date.now(),BASE=((41*24+7)*3600+22*60+15);
setInterval(function(){var s=BASE+Math.floor((Date.now()-T0)/1000),d=Math.floor(s/86400);s-=d*86400;var h=Math.floor(s/3600);s-=h*3600;var m=Math.floor(s/60);s-=m*60;
  document.getElementById('met').textContent=('00'+d).slice(-3)+':'+pad(h)+':'+pad(m)+':'+pad(s)},1000);
render();
loadInputs();poll();setInterval(poll,2000);
})();
</script>
</body>
</html>
